name: Release APK

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v11.2.8). Leave empty to use v<versionName>."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Android setup
        uses: ./.github/actions/android-setup

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            VER="$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure local signing and API keys
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        shell: bash
        run: |
          touch local.properties
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            mkdir -p keystore
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > keystore/release.jks
            {
              echo "RELEASE_STORE_FILE=keystore/release.jks"
              echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            } >> local.properties
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 (or signing secrets) is not configured; release APK will be signed with the CI debug key."
          fi
          if [ -n "$KLIPY_API_KEY" ]; then
            echo "KLIPY_API_KEY=$KLIPY_API_KEY" >> local.properties
          fi
          if [ -n "$GIPHY_API_KEY" ]; then
            echo "GIPHY_API_KEY=$GIPHY_API_KEY" >> local.properties
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release and Debug APK
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare release assets
        shell: bash
        run: |
          rm -rf dist/release
          mkdir -p dist/release
          REL_APK="$(ls -1 app/build/outputs/apk/release/*.apk | head -n1)"
          DBG_APK="$(ls -1 app/build/outputs/apk/debug/*.apk | head -n1)"
          cp "$REL_APK" "dist/release/ExpressiveKeyboard-${{ steps.meta.outputs.tag }}-release.apk"
          cp "$DBG_APK" "dist/release/ExpressiveKeyboard-${{ steps.meta.outputs.tag }}-debug.apk"
          ls -lh dist/release

      - name: Clean temporary signing files
        if: always()
        shell: bash
        run: rm -rf keystore local.properties

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Expressive Keyboard ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/release/*.apk
